<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Quiz Challenge</title>
<style>
:root{--bg:#0b1020;--card:#121a2f;--card2:#18233d;--text:#f5f7ff;--muted:#aeb8d2;--accent:#7c5cff;--good:#27d17f;--bad:#ff5f6d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#080c18,#111b38);color:var(--text);min-height:100vh}
.wrap{width:min(760px,94%);margin:auto;padding:28px 0 50px}.hero{text-align:center;padding:28px 10px 18px}
h1{font-size:clamp(30px,7vw,52px);margin:0 0 8px}.sub{color:var(--muted);font-size:16px}
.card{background:rgba(18,26,47,.96);border:1px solid #263250;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.pill{background:#202d4d;padding:8px 12px;border-radius:999px;font-size:13px;color:#dce3f8}
.progress{height:8px;background:#263250;border-radius:20px;overflow:hidden;margin-bottom:25px}.bar{height:100%;background:linear-gradient(90deg,#7c5cff,#27b7ff);width:0;transition:.3s}
.question{font-size:24px;font-weight:750;line-height:1.3;margin:10px 0 22px}.options{display:grid;gap:12px}
button{font:inherit;cursor:pointer;border:0}.option{padding:15px 16px;text-align:left;border-radius:15px;background:var(--card2);color:var(--text);border:1px solid #2a395e;transition:.18s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:#7c5cff}.option:disabled{cursor:default}.correct{background:rgba(39,209,127,.16);border-color:var(--good)}.wrong{background:rgba(255,95,109,.14);border-color:var(--bad)}
.next,.restart{width:100%;margin-top:18px;padding:15px;border-radius:15px;background:linear-gradient(90deg,#7c5cff,#596dff);color:white;font-weight:750}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:64px;font-weight:850;margin:10px}.hide{display:none}.small{color:var(--muted);font-size:14px;margin-top:12px}
.cat{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>🏆 Ultimate Quiz Challenge</h1><div class="sub">Cars & Bikes • Gaming • Sports</div></div>
  <div class="card" id="game">
    <div class="top"><span class="pill" id="count"></span><span class="pill">Score: <b id="score">0</b></span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="cat" id="category"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <button class="next" id="next" disabled>Next Question →</button>
    <div class="small">हर सही जवाब = +10 points</div>
  </div>
  <div class="card result hide" id="result">
    <div style="font-size:60px">🎉</div><h2>Quiz Complete!</h2>
    <div class="score" id="finalScore">0/0</div>
    <div id="message"></div>
    <button class="restart" onclick="restart()">Play Again 🔄</button>
  </div>
</div>
<script>
const questions=[
 {c:"🏎️ Cars & Bikes",q:"Bugatti किस देश की कार निर्माता कंपनी है?",o:["France","Germany","Italy","Japan"],a:0},
 {c:"🏎️ Cars & Bikes",q:"Royal Enfield का सबसे प्रसिद्ध भारतीय मॉडल कौन सा है?",o:["Classic 350","Ninja 650","R15","Duke 390"],a:0},
 {c:"🏎️ Cars & Bikes",q:"Lamborghini का लोगो किस जानवर पर आधारित है?",o:["घोड़ा","सांड","शेर","चीता"],a:1},
 {c:"🎮 Gaming",q:"Minecraft किस कंपनी ने बनाया था?",o:["Mojang","Nintendo","Valve","Epic Games"],a:0},
 {c:"🎮 Gaming",q:"GTA V किस studio ने बनाया?",o:["Rockstar Games","Ubisoft","EA","Activision"],a:0},
 {c:"🎮 Gaming",q:"PUBG का पूरा नाम क्या है?",o:["PlayerUnknown's Battlegrounds","Public Player Battle Game","Pro Ultimate Battle Game","Player United Battle Grounds"],a:0},
 {c:"⚽ Sports",q:"क्रिकेट में एक over में कितनी legal balls होती हैं?",o:["4","5","6","8"],a:2},
 {c:"⚽ Sports",q:"फुटबॉल टीम में मैदान पर कितने खिलाड़ी होते हैं?",o:["9","10","11","12"],a:2},
 {c:"⚽ Sports",q:"Wimbledon किस खेल का प्रसिद्ध tournament है?",o:["Tennis","Cricket","Hockey","Golf"],a:0},
 {c:"🏎️ Cars & Bikes",q:"Yamaha R15 किस प्रकार का वाहन है?",o:["Bike","Car","Truck","Scooter"],a:0}
];
let i=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function load(){
 answered=false;$("next").disabled=true;
 const x=questions[i];$("count").textContent=`Question ${i+1} / ${questions.length}`;
 $("score").textContent=score;$("category").textContent=x.c;$("question").textContent=x.q;
 $("bar").style.width=((i)/questions.length*100)+"%";$("options").innerHTML="";
 x.o.forEach((v,n)=>{const b=document.createElement("button");b.className="option";b.textContent=`${String.fromCharCode(65+n)}. ${v}`;b.onclick=()=>choose(n,b);$("options").appendChild(b)});
}
function choose(n,btn){
 if(answered)return;answered=true;const x=questions[i];document.querySelectorAll(".option").forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add("correct")});
 if(n===x.a){score+=10}else btn.classList.add("wrong");$("score").textContent=score;$("next").disabled=false;
}
$("next").onclick=()=>{i++;if(i<questions.length)load();else finish()};
function finish(){
 $("game").classList.add("hide");$("result").classList.remove("hide");$("finalScore").textContent=`${score} / ${questions.length*10}`;
 $("message").textContent=score>=80?"🔥 शानदार! तुम Quiz Master हो!":score>=50?"👏 बहुत अच्छा! एक और बार try करो!":"💪 Practice करो, अगली बार score और बढ़ेगा!";
}
function restart(){i=0;score=0;$("result").classList.add("hide");$("game").classList.remove("hide");load()}
load();
</script>
</body></html>
